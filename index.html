<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reader</title>
  <style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#202124;font-family:Arial,sans-serif}
header{background:#087c3e;color:#fff;text-align:center;padding:15px;font-size:23px;font-weight:700}
.version{font-size:12px;font-weight:400;opacity:.9}
.container{width:96%;max-width:1280px;margin:16px auto 40px}
.upload-card,.file-list,.progress-card,.table-card{background:#fff;border-radius:12px;margin-top:12px}
.upload-card{padding:22px 14px;text-align:center;border:2px dashed #087c3e}
.upload-card h1{margin:0 0 8px;font-size:22px}
.upload-card p{margin:0;color:#666;font-size:13px}
.buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}
.button{border:0;border-radius:8px;padding:12px 17px;font-weight:700;font-size:14px;cursor:pointer}
.primary{background:#087c3e;color:#fff}
.secondary{background:#e7eee9;color:#17633a}
.danger{background:#fbe8e8;color:#a21c1c}
button:disabled{opacity:.42;cursor:not-allowed}
.native-picker{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.native-picker input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.summary div{background:#fff;border-radius:10px;text-align:center;padding:10px}
.summary strong{display:block;color:#087c3e;font-size:23px}
.file-list{padding:10px;max-height:170px;overflow:auto}
.file-item{padding:7px;border-bottom:1px solid #eee;font-size:13px;overflow-wrap:anywhere}
.progress-card{padding:12px}
.progress-track{height:14px;border-radius:20px;background:#e4e9e6;overflow:hidden}
#progressBar{height:100%;width:0;background:#087c3e;transition:width .2s}
#statusText{text-align:center;margin-top:8px;font-size:13px}
.table-card{overflow-x:auto}
table{width:100%;min-width:1050px;border-collapse:collapse}
th{position:sticky;top:0;background:#087c3e;color:#fff;padding:9px 6px;font-size:12px;white-space:nowrap}
td{border:1px solid #ddd;padding:8px 6px;text-align:center;font-size:12px}
.success{color:#087c3e;font-weight:700}
.warning{color:#b26a00;font-weight:700}
.hidden{display:none}
@media(max-width:650px){
  header{font-size:20px}
  .button{width:100%}
  .upload-card h1{font-size:20px}
}
</style>
</head>
<body>
<header>PDF Reader <span class="version">v2.2</span></header>

<main class="container">
  <section class="upload-card">
    <h1>Registry PDF Upload</h1>
    <p>एक साथ अधिकतम 100 PDF</p>
    <div class="buttons">
      <div class="button primary native-picker">📁 Select PDFs
        <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple>
      </div>
      <button id="readButton" class="button primary" disabled>▶ Read Data</button>
      <button id="csvButton" class="button secondary" disabled>⬇ Download CSV</button>
      <button id="clearButton" class="button danger" disabled>🗑 Clear</button>
    </div>
  </section>

  <section class="summary">
    <div>Selected<strong id="selectedCount">0</strong></div>
    <div>Completed<strong id="completedCount">0</strong></div>
    <div>Check<strong id="checkCount">0</strong></div>
  </section>

  <section id="fileList" class="file-list hidden"></section>

  <section id="progressArea" class="progress-card hidden">
    <div class="progress-track"><div id="progressBar"></div></div>
    <div id="statusText">Ready</div>
  </section>

  <section class="table-card">
    <table>
      <thead>
        <tr>
          <th>Sr.</th>
          <th>Deed Type</th>
          <th>Registry No.</th>
          <th>Registration Date</th>
          <th>Token No.</th>
          <th>Deed Amount</th>
          <th>Land Value</th>
          <th>Stamp Duty</th>
          <th>Registration Fee</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="10">पहले PDF चुनें</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js?v=22"></script>
<script>
"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const fileInput = $("fileInput");
const readButton = $("readButton");
const csvButton = $("csvButton");
const clearButton = $("clearButton");
const fileList = $("fileList");
const progressArea = $("progressArea");
const progressBar = $("progressBar");
const statusText = $("statusText");
const resultBody = $("resultBody");
const selectedCount = $("selectedCount");
const completedCount = $("completedCount");
const checkCount = $("checkCount");

let selectedFiles = [];
let results = [];

fileInput.addEventListener("change", () => {
  const chosen = Array.from(fileInput.files || []);
  const files = chosen.filter(file =>
    file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")
  );

  if (chosen.length > 100) {
    alert("एक बार में अधिकतम 100 PDF चुनें।");
    fileInput.value = "";
    return;
  }

  if (chosen.length && files.length !== chosen.length) {
    alert("सिर्फ PDF files चुनें।");
  }

  selectedFiles = files;
  results = [];
  selectedCount.textContent = String(files.length);
  completedCount.textContent = "0";
  checkCount.textContent = "0";
  readButton.disabled = files.length === 0;
  csvButton.disabled = true;
  clearButton.disabled = files.length === 0;
  renderFiles();

  resultBody.innerHTML = files.length
    ? `<tr><td colspan="10">${files.length} PDF चुनी गई हैं। अब Read Data दबाएँ।</td></tr>`
    : `<tr><td colspan="10">पहले PDF चुनें</td></tr>`;
});

clearButton.addEventListener("click", resetAll);

function resetAll() {
  selectedFiles = [];
  results = [];
  fileInput.value = "";
  selectedCount.textContent = "0";
  completedCount.textContent = "0";
  checkCount.textContent = "0";
  readButton.disabled = true;
  csvButton.disabled = true;
  clearButton.disabled = true;
  fileList.innerHTML = "";
  fileList.classList.add("hidden");
  progressArea.classList.add("hidden");
  progressBar.style.width = "0%";
  resultBody.innerHTML = `<tr><td colspan="10">पहले PDF चुनें</td></tr>`;
}

function renderFiles() {
  if (!selectedFiles.length) {
    fileList.classList.add("hidden");
    return;
  }
  fileList.classList.remove("hidden");
  fileList.innerHTML = selectedFiles.map((file, i) =>
    `<div class="file-item">${i + 1}. ${escapeHtml(file.name)}</div>`
  ).join("");
}

readButton.addEventListener("click", async () => {
  if (!selectedFiles.length) return;

  results = [];
  resultBody.innerHTML = "";
  progressArea.classList.remove("hidden");
  readButton.disabled = true;
  csvButton.disabled = true;

  let completed = 0;
  let checks = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    setProgress(i, selectedFiles.length,
      `Reading ${i + 1}/${selectedFiles.length}: ${file.name}`);

    try {
      const text = await extractFirstTwoPages(file);
      const record = parseRegistryText(text);
      record.fileName = file.name;

      const identityOkay = Boolean(
        record.deedType &&
        record.registryNumber &&
        record.registrationDate &&
        record.tokenNumber
      );

      record.status = identityOkay ? "Completed" : "Check";
      if (identityOkay) completed++;
      else checks++;

      results.push(record);
      appendRow(record, i + 1);
    } catch (error) {
      console.error(file.name, error);
      const record = emptyRecord();
      record.fileName = file.name;
      record.status = "Check";
      results.push(record);
      checks++;
      appendRow(record, i + 1);
    }

    completedCount.textContent = String(completed);
    checkCount.textContent = String(checks);
  }

  setProgress(selectedFiles.length, selectedFiles.length,
    `Completed: ${completed} | Check: ${checks}`);

  readButton.disabled = false;
  csvButton.disabled = results.length === 0;
});

async function extractFirstTwoPages(file) {
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
  const pageCount = Math.min(2, pdf.numPages);
  const pageTexts = [];

  for (let pageNumber = 1; pageNumber <= pageCount; pageNumber++) {
    statusText.textContent = `PDF Page ${pageNumber}/${pageCount} पढ़ रहा है...`;
    const page = await pdf.getPage(pageNumber);
    const content = await page.getTextContent();
    const lines = groupPdfItemsIntoLines(content.items);
    pageTexts.push(lines.join("\n"));
  }

  return normalizeText(pageTexts.join("\n"));
}

function groupPdfItemsIntoLines(items) {
  const usable = items
    .filter(item => String(item.str || "").trim())
    .map(item => ({
      text: String(item.str || "").trim(),
      x: Number(item.transform?.[4] || 0),
      y: Number(item.transform?.[5] || 0)
    }))
    .sort((a, b) => (b.y - a.y) || (a.x - b.x));

  const rows = [];
  const tolerance = 4;

  for (const item of usable) {
    let row = rows.find(candidate => Math.abs(candidate.y - item.y) <= tolerance);
    if (!row) {
      row = {y: item.y, items: []};
      rows.push(row);
    }
    row.items.push(item);
  }

  return rows
    .sort((a, b) => b.y - a.y)
    .map(row => row.items
      .sort((a, b) => a.x - b.x)
      .map(item => item.text)
      .join(" ")
      .replace(/\s+/g, " ")
      .trim()
    )
    .filter(Boolean);
}

function parseRegistryText(text) {
  const clean = normalizeText(text);
  const compact = compactText(clean);
  const record = emptyRecord();

  record.deedType = extractDeedType(clean);

  record.registryNumber =
    extractByCompactLabel(compact, [
      "प्रलेखक्र", "registrationno", "registrationnumber", "regno"
    ], "integer") ||
    firstMatch(clean, [
      /Registration\s*No\.?\s*[:\-]?\s*(\d+)/i,
      /Registration\s*Number\s*[:\-]?\s*(\d+)/i
    ]);

  record.registrationDate = normalizeDate(
    extractByCompactLabel(compact, [
      "पंजीकरणदिनांक", "registrationdate"
    ], "date") ||
    firstMatch(clean, [
      /Registration\s*No\.?\s*[:\-]?\s*\d+\s*Date\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i,
      /\bDate\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i
    ])
  );

  record.tokenNumber =
    extractToken(clean) ||
    firstMatch(clean, [/\b(PAN_[A-Z0-9_]+)\b/i]);

  record.deedAmount = extractMoney(compact, [
    "लेनदेनराशि", "transactionamount", "considerationamount", "deedamount"
  ]);

  record.landValue = extractMoney(compact, [
    "कलेक्टरदर", "कलैक्टरदर", "landvalue", "collectorvalue", "collectorrate"
  ]);

  record.stampDuty =
    extractMoney(compact, [
      "कुलस्टाम्पशुल्क", "कुलस्टांपशुल्क", "stampdutypaid", "stampduty"
    ]) ||
    "0.00";

  record.registrationFees =
    extractMoney(compact, [
      "पंजीकरणफीस", "पंजीकरणशुल्क", "registrationfees", "registrationfee"
    ]) ||
    "0.00";

  return record;
}

function extractDeedType(text) {
  const lines = text.split(/\n+/).map(x => x.trim()).filter(Boolean);

  const exact = [
    ["TRANSFER OF IMMOVABLE PROPERTY", /TRANSFER\s+OF\s+IMMOVABLE\s+PROPERTY\s+DEED/i],
    ["POWER OF ATTORNEY", /POWER\s+OF\s+ATTORNEY\s+DEED/i],
    ["CONVEYANCE", /CONVEYANCE\s+DEED/i],
    ["AGREEMENT", /AGREEMENT\s+DEED/i],
    ["TARTIMA", /TARTIMA\s+DEED/i],
    ["TRUST", /TRUST\s+DEED/i],
    ["SALE", /SALE\s+DEED/i],
    ["GIFT", /GIFT\s+DEED/i],
    ["WILL", /WILL\s+DEED/i],
    ["LEASE", /LEASE\s+DEED/i],
    ["ADOPTION", /ADOPTION\s+DEED/i],
    ["RECTIFICATION", /RECTIFICATION\s+DEED/i],
    ["CANCELLATION", /CANCELLATION\s+DEED/i],
    ["PARTITION", /PARTITION\s+DEED/i],
    ["RELEASE", /RELEASE\s+DEED/i]
  ];

  for (const [label, pattern] of exact) {
    if (pattern.test(text)) return label;
  }

  for (const line of lines) {
    const m = line.match(/^([A-Z][A-Z /&()'-]{1,80})\s+DEED$/i);
    if (m) return m[1].replace(/\s+/g, " ").trim().toUpperCase();
  }

  const purpose = firstMatch(text, [/Purpose\s*:\s*([A-Z][A-Z ]{1,60})/i]);
  return purpose ? purpose.toUpperCase().trim() : "";
}

function normalizeText(value) {
  return String(value || "")
    .replace(/\u00a0/g, " ")
    .replace(/[\u200b\u200c\u200d\ufeff]/g, "")
    .replace(/[–—]/g, "-")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
}

function compactText(value) {
  return normalizeText(value)
    .toLowerCase()
    .replace(/[₹:;|()[\]{}–—\-_,/]/g, "")
    .replace(/\s+/g, "");
}

function extractByCompactLabel(compact, labels, kind) {
  for (const label of labels) {
    const index = compact.indexOf(label);
    if (index === -1) continue;
    const after = compact.slice(index + label.length, index + label.length + 80);

    if (kind === "integer") {
      const m = after.match(/(\d{1,10})/);
      if (m) return m[1];
    }

    if (kind === "date") {
      const m = after.match(/(\d{1,2})(\d{1,2})(\d{4})/);
      if (m) return `${m[1]}/${m[2]}/${m[3]}`;
    }
  }
  return "";
}

function extractToken(text) {
  const m = String(text || "").match(/\b(PAN_[A-Z0-9_]+)\b/i);
  return m ? m[1] : "";
}

function extractMoney(compact, labels) {
  const boundaries = [
    "लेनदेनराशि", "transactionamount", "considerationamount", "deedamount",
    "कलेक्टरदर", "कलैक्टरदर", "landvalue", "collectorvalue", "collectorrate",
    "कुलस्टाम्पशुल्क", "कुलस्टांपशुल्क", "stampdutypaid", "stampduty",
    "पंजीकरणफीस", "पंजीकरणशुल्क", "registrationfees", "registrationfee",
    "कुलक्रेता", "कुलदावेदार", "कुलन्यासी", "कुलप्राधिकत", "ईचालान",
    "स्टाम्पकामूल्य", "स्टांपकामूल्य", "पेस्टिंगशुल्क"
  ];

  for (const label of labels) {
    const start = compact.indexOf(label);
    if (start === -1) continue;

    const valueStart = start + label.length;
    let valueEnd = Math.min(compact.length, valueStart + 100);

    for (const boundary of boundaries) {
      const next = compact.indexOf(boundary, valueStart);
      if (next !== -1 && next < valueEnd) valueEnd = next;
    }

    const segment = compact.slice(valueStart, valueEnd);

    // "रुपये" may appear immediately with no number (e.g. collector rate blank).
    if (/^रुपये/.test(segment)) return "0.00";

    const match = segment.match(/(\d[\d,]{0,14}(?:\.\d{1,2})?)/);
    if (!match) return "0.00";
    return formatAmount(match[1]);
  }

  return "0.00";
}

function firstMatch(text, patterns) {
  for (const pattern of patterns) {
    const match = String(text || "").match(pattern);
    if (match && match[1]) return match[1].trim();
  }
  return "";
}

function normalizeDate(value) {
  if (!value) return "";
  const s = String(value).replace(/-/g, "/");
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[1].padStart(2,"0")}/${m[2].padStart(2,"0")}/${m[3]}` : s;
}

function formatAmount(value) {
  const cleaned = String(value || "")
    .replace(/,/g, "")
    .replace(/[^\d.]/g, "");
  const number = Number(cleaned);
  return Number.isFinite(number) ? number.toFixed(2) : "0.00";
}

function emptyRecord() {
  return {
    fileName: "",
    deedType: "",
    registryNumber: "",
    registrationDate: "",
    tokenNumber: "",
    deedAmount: "0.00",
    landValue: "0.00",
    stampDuty: "0.00",
    registrationFees: "0.00",
    status: ""
  };
}

function appendRow(record, serial) {
  const statusClass = record.status === "Completed" ? "success" : "warning";
  resultBody.insertAdjacentHTML("beforeend", `
    <tr>
      <td>${serial}</td>
      <td>${escapeHtml(record.deedType || "Not Found")}</td>
      <td>${escapeHtml(record.registryNumber || "Not Found")}</td>
      <td>${escapeHtml(record.registrationDate || "Not Found")}</td>
      <td>${escapeHtml(record.tokenNumber || "Not Found")}</td>
      <td>${record.deedAmount}</td>
      <td>${record.landValue}</td>
      <td>${record.stampDuty}</td>
      <td>${record.registrationFees}</td>
      <td class="${statusClass}">${record.status}</td>
    </tr>
  `);
}

function setProgress(done, total, message) {
  const percent = total ? Math.round((done / total) * 100) : 0;
  progressBar.style.width = percent + "%";
  statusText.textContent = message;
}

csvButton.addEventListener("click", () => {
  if (!results.length) return;

  const rows = [[
    "Deed Type", "Registry Number", "Registration Date", "Token Number",
    "Deed Amount", "Land Value", "Stamp Duty", "Registration Fee"
  ], ...results.map(r => [
    r.deedType, r.registryNumber, r.registrationDate, r.tokenNumber,
    r.deedAmount, r.landValue, r.stampDuty, r.registrationFees
  ])];

  const csv = "\uFEFF" + rows.map(row => row.map(csvCell).join(",")).join("\n");
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "registry-pdf-data.csv";
  link.click();
  URL.revokeObjectURL(url);
});

function csvCell(value) {
  return `"${String(value ?? "").replace(/"/g, '""')}"`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>
</body>
</html>
