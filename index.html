<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panipat Registry Reader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#202124}
header{background:#087c3e;color:#fff;text-align:center;padding:16px;font-size:24px;font-weight:700}
.container{width:94%;max-width:1200px;margin:18px auto 40px}
.upload-box{background:#fff;border:2px dashed #087c3e;border-radius:14px;text-align:center;padding:28px 15px}
.upload-box h2{margin:0 0 10px}
.upload-box p{color:#666;font-size:14px}
#fileInput{display:none}
.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:15px}
button,.select-button{border:none;border-radius:8px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.select-button,.green-button{background:#087c3e;color:#fff}
.gray-button{background:#e7eee9;color:#17633a}
.red-button{background:#fbe8e8;color:#a21c1c}
button:disabled{opacity:.45;cursor:not-allowed}
#fileList{display:none;background:#fff;border-radius:10px;padding:12px;margin-top:14px;max-height:180px;overflow:auto}
.file-item{border-bottom:1px solid #eee;padding:8px;font-size:13px;overflow-wrap:anywhere}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.summary-box{background:#fff;border-radius:10px;text-align:center;padding:11px}
.summary-box strong{display:block;color:#087c3e;font-size:22px}
#progressArea{display:none;background:#fff;padding:12px;border-radius:10px;margin-top:14px}
.progress-track{height:14px;border-radius:20px;background:#e4e9e6;overflow:hidden}
#progressBar{width:0%;height:100%;background:#087c3e;transition:width .2s}
#statusText{margin-top:8px;text-align:center;font-size:14px}
.table-wrap{background:#fff;overflow-x:auto;margin-top:15px;border-radius:10px}
table{width:100%;min-width:1080px;border-collapse:collapse}
th{background:#087c3e;color:#fff;padding:10px 7px;font-size:13px;white-space:nowrap}
td{border:1px solid #ddd;padding:9px 7px;text-align:center;font-size:13px}
.file-name{text-align:left;max-width:190px;overflow-wrap:anywhere}
.success{color:green;font-weight:700}
.error{color:red;font-weight:700}
@media(max-width:600px){
  header{font-size:20px}
  button,.select-button{width:100%}
  .summary-box{font-size:12px;padding:8px 3px}
}
</style>
</head>

<body>
<header>Panipat Registry Reader</header>

<div class="container">
  <div class="upload-box">
    <h2>Registry PDF / Image Upload</h2>
    <p>PDF, JPG, JPEG और PNG — अधिकतम 100 Files</p>

    <div class="buttons">
      <label class="select-button" for="fileInput">📁 Select Files</label>
      <input id="fileInput" type="file"
             accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
             multiple>

      <button id="processButton" class="green-button" disabled>▶ Start Reading</button>
      <button id="csvButton" class="gray-button" disabled>⬇ Download CSV</button>
      <button id="clearButton" class="red-button" disabled>🗑 Clear</button>
    </div>
  </div>

  <div class="summary">
    <div class="summary-box">Selected<strong id="selectedCount">0</strong></div>
    <div class="summary-box">Completed<strong id="completedCount">0</strong></div>
    <div class="summary-box">Failed<strong id="failedCount">0</strong></div>
  </div>

  <div id="fileList"></div>

  <div id="progressArea">
    <div class="progress-track"><div id="progressBar"></div></div>
    <div id="statusText">Ready</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Sr.</th>
          <th>File Name</th>
          <th>Deed Type</th>
          <th>Registry No.</th>
          <th>Registration Date</th>
          <th>Token No.</th>
          <th>Deed Amount</th>
          <th>Collector Rate</th>
          <th>Stamp Duty</th>
          <th>Registration Fee</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="11">पहले PDF या Image Select करें</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fileInput = document.getElementById("fileInput");
const processButton = document.getElementById("processButton");
const csvButton = document.getElementById("csvButton");
const clearButton = document.getElementById("clearButton");
const fileList = document.getElementById("fileList");
const resultBody = document.getElementById("resultBody");
const selectedCount = document.getElementById("selectedCount");
const completedCount = document.getElementById("completedCount");
const failedCount = document.getElementById("failedCount");
const progressArea = document.getElementById("progressArea");
const progressBar = document.getElementById("progressBar");
const statusText = document.getElementById("statusText");

let selectedFiles = [];
let finalResults = [];

fileInput.addEventListener("change", function(){
  const files = Array.from(fileInput.files || []);

  if(files.length > 100){
    alert("एक बार में अधिकतम 100 Files Select करें।");
    fileInput.value = "";
    return;
  }

  selectedFiles = files;
  finalResults = [];

  selectedCount.textContent = selectedFiles.length;
  completedCount.textContent = "0";
  failedCount.textContent = "0";

  processButton.disabled = selectedFiles.length === 0;
  clearButton.disabled = selectedFiles.length === 0;
  csvButton.disabled = true;

  showFiles();

  resultBody.innerHTML = selectedFiles.length
    ? `<tr><td colspan="11">${selectedFiles.length} Files Select हो गई हैं। अब Start Reading दबाएँ।</td></tr>`
    : `<tr><td colspan="11">पहले PDF या Image Select करें</td></tr>`;
});

function showFiles(){
  if(!selectedFiles.length){
    fileList.style.display = "none";
    fileList.innerHTML = "";
    return;
  }

  fileList.style.display = "block";
  fileList.innerHTML = selectedFiles.map((file,index) =>
    `<div class="file-item">${index + 1}. ${escapeHtml(file.name)}</div>`
  ).join("");
}

clearButton.addEventListener("click", function(){
  selectedFiles = [];
  finalResults = [];
  fileInput.value = "";

  selectedCount.textContent = "0";
  completedCount.textContent = "0";
  failedCount.textContent = "0";

  processButton.disabled = true;
  csvButton.disabled = true;
  clearButton.disabled = true;

  progressArea.style.display = "none";
  progressBar.style.width = "0%";
  showFiles();

  resultBody.innerHTML =
    `<tr><td colspan="11">पहले PDF या Image Select करें</td></tr>`;
});

processButton.addEventListener("click", async function(){
  if(!selectedFiles.length) return;

  processButton.disabled = true;
  csvButton.disabled = true;
  finalResults = [];
  resultBody.innerHTML = "";
  progressArea.style.display = "block";

  let completed = 0;
  let failed = 0;

  for(let i = 0; i < selectedFiles.length; i++){
    const file = selectedFiles[i];

    setProgress(i, selectedFiles.length,
      `Reading ${i + 1}/${selectedFiles.length}: ${file.name}`);

    let record;

    try{
      const text = await readFile(file);
      record = extractData(text);
      record.fileName = file.name;

      if(hasData(record)){
        record.status = "Completed";
        completed++;
      }else{
        record.status = "Data Not Found";
        failed++;
      }
    }catch(error){
      console.error(error);
      record = emptyRecord();
      record.fileName = file.name;
      record.status = "Error";
      failed++;
    }

    finalResults.push(record);
    addTableRow(record, i + 1);

    completedCount.textContent = completed;
    failedCount.textContent = failed;
  }

  setProgress(selectedFiles.length, selectedFiles.length,
    `Completed: ${completed} | Failed: ${failed}`);

  processButton.disabled = false;
  csvButton.disabled = finalResults.length === 0;
});

async function readFile(file){
  const name = file.name.toLowerCase();

  if(file.type === "application/pdf" || name.endsWith(".pdf")){
    return await readPdf(file);
  }

  if(file.type.startsWith("image/") ||
     name.endsWith(".jpg") ||
     name.endsWith(".jpeg") ||
     name.endsWith(".png")){
    statusText.textContent = "Image OCR चल रहा है...";
    return await runOcr(file);
  }

  throw new Error("Unsupported File");
}

async function readPdf(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

  const pagesToRead = Math.min(pdf.numPages, 2);
  let fullText = "";

  for(let pageNumber = 1; pageNumber <= pagesToRead; pageNumber++){
    statusText.textContent =
      `PDF Page ${pageNumber}/${pagesToRead} पढ़ रहा है...`;

    const page = await pdf.getPage(pageNumber);
    const textContent = await page.getTextContent();

    /*
      str के साथ spaces जोड़ना जरूरी है।
      Panipat PDF की Hindi अक्सर "रा शि", "पंजी करण" जैसे टुकड़ों में आती है।
    */
    fullText += " " + textContent.items
      .map(item => String(item.str || ""))
      .join(" ");
  }

  if(normalizeText(fullText).length < 60){
    fullText = "";

    for(let pageNumber = 1; pageNumber <= pagesToRead; pageNumber++){
      statusText.textContent =
        `Scanned PDF Page ${pageNumber} OCR चल रहा है...`;

      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({scale: 1.5});
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);

      await page.render({canvasContext: context, viewport}).promise;
      fullText += " " + await runOcr(canvas);
    }
  }

  return fullText;
}

async function runOcr(source){
  const result = await Tesseract.recognize(source, "eng", {
    logger: function(message){
      if(message.status === "recognizing text" &&
         typeof message.progress === "number"){
        statusText.textContent =
          `OCR ${Math.round(message.progress * 100)}%`;
      }
    }
  });

  return result.data.text || "";
}

function extractData(originalText){
  const text = normalizeText(originalText);

  return {
    fileName: "",

    deedType: firstMatch(text, [
      /\b(SALE\s+DEED)\b/i,
      /\b(GIFT\s+DEED)\b/i,
      /\b(LEASE\s+DEED)\b/i,
      /\b(TRANSFER\s+DEED)\b/i,
      /\b(CONVEYANCE\s+DEED)\b/i,
      /\b(CONVEYANCE)\b/i,
      /\b(AGREEMENT)\b/i,
      /\b(PARTITION)\b/i,
      /\b(RE-?MORTGAGE)\b/i,
      /\b(TRUST\s+DEED)\b/i,
      /\b(SURRENDER\s+OF\s+LEASE)\b/i,
      /Purpose\s*[:\-]\s*([A-Z ]{3,30})/i
    ]),

    registryNumber: cleanNumber(firstMatch(text, [
      /प्रलेख\s*क्र\.?\s*[:\-]?\s*(\d+)/i,
      /Registration\s*No\.?\s*[:\-]?\s*(\d+)/i,
      /Registration\s*Number\s*[:\-]?\s*(\d+)/i
    ])),

    registrationDate: cleanDate(firstMatch(text, [
      /पंजी\s*करण\s*दि\s*नां\s*क\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i,
      /पंजीकरण\s*दिनांक\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i,
      /Registration\s*No\.?\s*[:\-]?\s*\d+\s*Date\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i,
      /Registration\s*Date\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i
    ])),

    tokenNumber: firstMatch(text, [
      /Token\s*(?:No\.?)?\s*[:\-]\s*([A-Z0-9_]+)/i,
      /\b(PAN_[A-Z0-9_]+)\b/i
    ]),

    /*
      यह function normal text और बिना-space compact Hindi दोनों पर खोजता है।
      इसलिए "लेन-देन रा शि", "लेन देन राशि", "लेन-देनराशि" सभी चलेंगे।
    */
    deedAmount: getLabeledAmount(text, [
      "लेन-देनराशि",
      "लेनदेनराशि",
      "लेन-देनराशि",
      "transactionamount",
      "considerationamount",
      "considerationvalue",
      "deedamount"
    ]),

    collectorRate: getLabeledAmount(text, [
      "कलेक्टरदर",
      "कलैक्टरदर",
      "collectorrate",
      "collectorvalue"
    ]),

    stampDuty: cleanAmount(firstMatch(text, [
      /Stamp\s*Duty\s*Paid\s*[:\-]?\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i,
      /कुल\s*स्टा\s*म्प\s*शुल्क\s*[-:]\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i,
      /कुल\s*स्टाम्प\s*शुल्क\s*[-:]\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i,
      /Stamp\s*Duty\s*[:\-]?\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i
    ])),

    registrationFees: cleanAmount(firstMatch(text, [
      /Registration\s*Fees?\s*[:\-]?\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i,
      /पंजी\s*करण\s*फी\s*स\s*[-:]\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i,
      /पंजीकरण\s*फीस\s*[-:]\s*(?:₹\s*)?([\d,]+(?:\.\d+)?)/i
    ])),

    status: ""
  };
}

/*
  Panipat PDF Hindi text में अक्षरों के बीच spaces आ जाते हैं।
  यह function spaces, ₹, colon, hyphen हटाकर compact text में label ढूंढता है।
*/
function getLabeledAmount(text, labels){
  const compact = String(text || "")
    .toLowerCase()
    .replace(/\u200b|\u200c|\u200d|\ufeff/g, "")
    .replace(/[₹:–—-]/g, "")
    .replace(/\s+/g, "");

  for(const label of labels){
    const compactLabel = String(label)
      .toLowerCase()
      .replace(/[₹:–—-]/g, "")
      .replace(/\s+/g, "");

    const index = compact.indexOf(compactLabel);

    if(index !== -1){
      const afterLabel = compact.slice(index + compactLabel.length);

      /*
        Label के तुरंत बाद आने वाला पहला बड़ा numeric value।
        1 से 15 digits और optional decimal।
      */
      const match = afterLabel.match(/([0-9][0-9,]{0,14}(?:\.[0-9]{1,2})?)/);

      if(match && match[1]){
        return cleanAmount(match[1]);
      }
    }
  }

  return "";
}

function normalizeText(text){
  return String(text || "")
    .replace(/\u00a0/g, " ")
    .replace(/\u200b|\u200c|\u200d|\ufeff/g, "")
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

function firstMatch(text, patterns){
  for(const pattern of patterns){
    const match = text.match(pattern);
    if(match && match[1]) return match[1].trim();
  }
  return "";
}

function cleanNumber(value){
  return String(value || "").replace(/[^\d]/g, "");
}

function cleanAmount(value){
  const cleaned = String(value || "")
    .replace(/,/g, "")
    .replace(/[^\d.]/g, "");

  if(!cleaned) return "";

  const number = Number(cleaned);
  return Number.isFinite(number) ? number.toFixed(2) : "";
}

function cleanDate(value){
  return value ? String(value).replace(/-/g, "/") : "";
}

function hasData(record){
  return Boolean(
    record.registryNumber ||
    record.tokenNumber ||
    record.deedType ||
    record.stampDuty ||
    record.registrationFees
  );
}

function emptyRecord(){
  return {
    fileName: "",
    deedType: "",
    registryNumber: "",
    registrationDate: "",
    tokenNumber: "",
    deedAmount: "",
    collectorRate: "",
    stampDuty: "",
    registrationFees: "",
    status: ""
  };
}

function addTableRow(record, serial){
  const statusClass =
    record.status === "Completed" ? "success" : "error";

  resultBody.insertAdjacentHTML("beforeend", `
    <tr>
      <td>${serial}</td>
      <td class="file-name">${escapeHtml(record.fileName)}</td>
      <td>${escapeHtml(record.deedType || "Not Found")}</td>
      <td>${escapeHtml(record.registryNumber || "Not Found")}</td>
      <td>${escapeHtml(record.registrationDate || "Not Found")}</td>
      <td>${escapeHtml(record.tokenNumber || "Not Found")}</td>
      <td>${escapeHtml(record.deedAmount || "Not Found")}</td>
      <td>${escapeHtml(record.collectorRate || "Not Found")}</td>
      <td>${escapeHtml(record.stampDuty || "Not Found")}</td>
      <td>${escapeHtml(record.registrationFees || "Not Found")}</td>
      <td class="${statusClass}">${escapeHtml(record.status)}</td>
    </tr>
  `);
}

function setProgress(done, total, message){
  const percentage = total ? Math.round((done / total) * 100) : 0;
  progressBar.style.width = percentage + "%";
  statusText.textContent = message;
}

csvButton.addEventListener("click", function(){
  if(!finalResults.length) return;

  const rows = [
    [
      "Deed Type",
      "Registry Number",
      "Registration Date",
      "Token Number",
      "Deed Amount",
      "Collector Rate",
      "Stamp Duty",
      "Registration Fee"
    ],
    ...finalResults.map(record => [
      record.deedType,
      record.registryNumber,
      record.registrationDate,
      record.tokenNumber,
      record.deedAmount,
      record.collectorRate,
      record.stampDuty,
      record.registrationFees
    ])
  ];

  const csv = "\uFEFF" +
    rows.map(row => row.map(csvCell).join(",")).join("\n");

  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "panipat-registry-data.csv";
  link.click();

  URL.revokeObjectURL(url);
});

function csvCell(value){
  const text = String(value || "").replace(/"/g, '""');
  return `"${text}"`;
}

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>
</body>
</html>
